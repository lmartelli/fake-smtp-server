server:
  port: 8080
  shutdown: immediate

spring:
  profiles:
    active: default

  threads:
    virtual:
      enabled: true

  data:
    web:
      pageable:
        size-parameter: size
        page-parameter: page
        default-page-size: 10
        one-indexed-parameters: false
        max-page-size: 1000

  mvc:
    hiddenmethod:
      filter:
        enabled: true

  jackson:
    time-zone: "UTC"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

fakesmtp:
  port: 8025
  webapp:
    authentication:
      username: ${FAKESMTP_WEBAPP_AUTH_USERNAME:}
      password: ${FAKESMTP_WEBAPP_AUTH_PASSWORD:}

